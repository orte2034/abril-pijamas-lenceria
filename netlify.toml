[build]
  command = "npm run build"
  publish = "public"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/catalogo"
  to = "/catalogo.html"
  status = 200

[[redirects]]
  from = "/producto/*"
  to = "/producto.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin.html"
  to = "/admin.html"
  status = 200

# Headers de seguridad y cache
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/logo.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Variables de entorno (configurar en Netlify Dashboard > Site settings > Environment variables)
# SUPABASE_URL = "https://xxxx.supabase.co"
# SUPABASE_ANON_KEY = "eyJ..."